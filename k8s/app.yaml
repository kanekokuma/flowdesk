apiVersion: v1
kind: Service
metadata:
  name: workflow-app
  namespace: workflow-app
spec:
  type: NodePort
  selector:
    app: workflow-app
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-app
  namespace: workflow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-app
  template:
    metadata:
      labels:
        app: workflow-app
    spec:
      containers:
        - name: app
          image: workflow-app:local
          imagePullPolicy: IfNotPresent
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: FLASK_SECRET_KEY
            - name: SESSION_TIMEOUT_MINUTES
              value: "30"
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
